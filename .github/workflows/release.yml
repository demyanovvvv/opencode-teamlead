name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi
      - run: npm run verify
      - run: npm run payload:check
      - run: npm run security:scan
      - run: npm run manifest:check
      - run: git diff --exit-code -- MANIFEST.sha256
      - run: npm run release:bundle
      - name: Verify archive checksum
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          ARTIFACT="dist/opencode-teamlead-v$VERSION.tar.gz"
          test -f "$ARTIFACT"
          test -f "$ARTIFACT.sha256"
          (cd dist && sha256sum -c "$(basename "$ARTIFACT").sha256")
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release create "$TAG" \
            "dist/opencode-teamlead-v$VERSION.tar.gz" \
            "dist/opencode-teamlead-v$VERSION.tar.gz.sha256" \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md
